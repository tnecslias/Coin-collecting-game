*{box-sizing:border-box}body{margin:0;background:#faf9f9;color:#202020;font-family:Arial,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}main{width:min(100%,510px);margin:0 auto;background:#263b4d;padding:20px 18px 16px}.stage{position:relative;width:100%;aspect-ratio:4/5;border-radius:8px;overflow:hidden;border:1px solid #b5c0c7;background:#f1f3f2}canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}.controls{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:18px}.score{margin:0;background:#fafafa;border:1px solid #b5c0c7;border-radius:6px;padding:15px 10px;text-align:center;font-size:clamp(19px,5.4vw,28px);font-weight:700;white-space:nowrap;min-width:45%}button{border:0;border-radius:5px;padding:17px 13px;background:#2e9dda;color:white;font:700 clamp(16px,4.4vw,23px) Arial,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;cursor:pointer;white-space:nowrap}button:hover{background:#238ac4}button:disabled{opacity:.55;cursor:wait}button:focus-visible{outline:3px solid #fff;outline-offset:3px}#loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#f1f3f2;padding:15px;font-size:16px}#loading[hidden]{display:none}progress{margin:15px auto;width:200px;accent-color:#2e9dda}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}footer{max-width:510px;margin:12px auto;padding:0 16px 12px;color:#65717a;font-size:12px;line-height:1.7}footer p{margin:5px 0}a{color:inherit}@media(max-width:420px){main{padding:14px 12px}.controls{gap:10px;margin-top:14px}.score{padding:14px 8px}button{padding:16px 10px}}@media(min-width:700px){main{margin-top:20px}}

.page-layout{display:grid;grid-template-columns:minmax(0,510px) 248px;align-items:start;justify-content:center;gap:60px;max-width:898px;margin:20px auto 0;padding:0 24px}.game-column{min-width:0}.page-layout main{margin:0;width:100%}.qr-panel{background:#fff;border:1px solid #d7dfe4;border-radius:10px;padding:18px;text-align:center;margin-top:20px}.qr-panel h2{font-size:18px;margin:0 0 12px}.qr-panel img{display:block;width:100%;height:auto;max-width:210px;margin:auto}@media(max-width:799px){.page-layout{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:0;padding:0}.game-column{width:100%;max-width:510px}.qr-panel{display:none}}
</style></head><body><div class="page-layout"><div class="game-column"><main aria-label="コイン集めゲーム"><div class="stage"><canvas id="unity-canvas" tabindex="0" aria-label="画面をタッチ、またはWASD・方向キーで移動"></canvas><div id="remaining" class="sr-only" aria-live="polite"></div><div id="stick" hidden></div><div id="loading"><div id="load-text">ゲームを読み込み中…</div><progress id="progress" max="1" value="0"></progress></div></div><div class="controls"><p class="score" aria-live="polite">コイン: <span id="score">0</span> 枚</p><button id="regenerate" disabled>コインを再生成</button></div></main><footer><p>画面タッチ / WASD・方向キーで移動</p><p>この作品は<a href="https://unity3d.jp/unity-chan_contents/license.php?lang=ja" target="_blank" rel="noopener">ユニティちゃんライセンス条項</a>の元に提供されています。<br>© Unity Technologies Japan</p></footer></div><aside class="qr-panel" aria-label="スマートフォンで遊ぶ"><h2>スマートフォンで遊ぶ</h2><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAZoAAAGaAQAAAAAefbjOAAADIklEQVR4nO1cbWrjMBAd2Yb+VKAHyFHsmy17pL2BfZQcoBD/LNjMMh+SnUCh3ppNHL33I8hxBqzxdObNk9TAtBlDtd2GCEYOOMIBRzjgCAcc4YAjHHDEkRwRHA2FcCIKnXzXjfLVaQ5EOhJ0x5nTRsDo1hEtC64yugQJgYZoODPrKHRU6/3EQuG9F3YE2ZtuNRiuNXMfJ+Je7th3PBHztZZgqNkip3/yOVUw+oEjmrvrQJEotDw3TGM9EY3vHNo/tz+CywtyBPNFCsapZuMMw3l6psf7FmC0R46IUhbGZRRkNHnpEKyVLLj89R0xaCehbUaikk4qhWMSzdZqPOrxtgFGP2eWCzQzMLPUijyyTiQDzPL1Yy+I9qCJQltQzwzjG2ve8Gb0NEOPOOLL/ScewcOZpc34aLS5ED7ZEMUPKxNM4xxYA+QQc6pgtEPVuLoeYR8UVaNQXSrTSyWaqBqFKFRk8pN2mj4yrUoiQuOF+wgeUZJR/BTt+i2FhVSIX8YohEycJ+k/wCMO+nK3If3hT7m5kG5CFjIkKWj9cGV7ufvkc6pgtAePqF2CshwR77iF3vLlLkREEStdvMSB88mULYRCaMpARBRXNdrUa/jbT3lDL5EjCuw1SDlD7jqk07TfeEeK7rOgHNEri7TLtNhpcWAc0zMIeEQ5OSJqN5FzRF7xXNFLrGuUxiNYd04pvGqkKMkdKTTLgla63jh0ql1LyhiCrnfothndeSuXUjoe83gbAaOd1jVYK0ReA08L4Zo8tPVIO3ShUL1y7NFKduDl7Sc9IgkVt/XjyedUwWifvdjsiSK3FJlZKsAsC95DReuN+R4MrmgiRxSjUCnS1gjXqpI8ge6z5DNdAuardBh2/C+1GbLn7lBz2gYY3Tli9EOd3NueSj/8uQoGlzDXRpsAo2M6IpgAYfVDeMTFd9Hw7yVKDjanbwFGX5zyI9l+G+S0nylUbf8pm25PQibe0zEeeI9e3xFx2QuxaBRz0CISujiljwc93ibAaNdeo1U9Yln2XEkWWPssIfYC/jPZId5TBSMDHOGAIxxwhAOOcMAR 'use strict';const canvas=document.getElementById('unity-canvas'),button=document.getElementById('regenerate');let unityInstance=null,activeTouch=null,mouseDown=false;
window.onCoinsChanged=(score,remaining,total)=>{document.getElementById('score').textContent=score;document.getElementById('remaining').textContent=remaining===0?'すべて集めました！ 再生成でもう一度':`残り ${remaining} / ${total} 枚`;};
function send(x,y){if(unityInstance)unityInstance.SendMessage('GameManager','SetMove',`${x.toFixed(4)},${y.toFixed(4)}`);}
function move(x,y){const r=canvas.getBoundingClientRect();let dx=x-r.left-r.width/2,dy=r.top+r.height/2-y;const length=Math.hypot(dx,dy);if(length<18){send(0,0);return;}send(dx/length,dy/length);document.getElementById('stick').classList.add('active');}
function stop(){activeTouch=null;mouseDown=false;send(0,0);document.getElementById('stick').classList.remove('active');}
canvas.addEventListener('touchstart',e=>{e.preventDefault();if(activeTouch!==null)return;const t=e.changedTouches[0];activeTouch=t.identifier;move(t.clientX,t.clientY);},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();const t=Array.from(e.touches).find(t=>t.identifier===activeTouch);if(t)move(t.clientX,t.clientY);},{passive:false});
for(const type of ['touchend','touchcancel'])canvas.addEventListener(type,e=>{e.preventDefault();if(Array.from(e.changedTouches).some(t=>t.identifier===activeTouch))stop();},{passive:false});
canvas.addEventListener('mousedown',e=>{if(e.button!==0)return;mouseDown=true;canvas.focus();move(e.clientX,e.clientY);});window.addEventListener('mousemove',e=>{if(mouseDown)move(e.clientX,e.clientY);});window.addEventListener('mouseup',stop);window.addEventListener('blur',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});button.addEventListener('click',()=>{stop();if(unityInstance)unityInstance.SendMessage('GameManager','RegenerateCoins');});
function fail(message){document.getElementById('loading').hidden=false;document.getElementById('load-text').textContent='読み込めませんでした。通信を確認して再読み込みしてください。';document.getElementById('progress').hidden=true;console.error(message);}
const script=document.createElement('script');script.src='Build/{{{ LOADER_FILENAME }}}';script.onerror=()=>fail('loader failed');script.onload=()=>createUnityInstance(canvas,{dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',companyName:'Honoka',productName:'Coin Garden',productVersion:'1.0',devicePixelRatio:Math.min(window.devicePixelRatio||1,1.5)},progress=>document.getElementById('progress').value=progress).then(instance=>{unityInstance=instance;document.getElementById('loading').hidden=true;button.disabled=false;}).catch(fail);document.body.appendChild(script);
</script></body></html>
